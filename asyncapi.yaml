asyncapi: 3.0.0
info:
  title: Regel - Rätt till VAH-försäkring
  version: 1.1.0
  description: Regel för att kontrollera om en person har rätt till Vård av husdjur.

channels:
  rtf.maskinell.requests:
    address: rtf.maskinell.requests
    messages:
      RtfMaskinellRequestMessage:
        $ref: "#/components/messages/RtfMaskinellRequestMessage"

  rtf.maskinell.responses:
    address: rtf.maskinell.responses
    messages:
      RtfMaskinellResponseMessage:
        $ref: "#/components/messages/RtfMaskinellResponseMessage"

operations:
  RtfMaskinellRequest:
    action: receive
    summary: Tillämpar regeln och kontrollerar om personen har rätt till Vård av husdjur.
    channel:
      $ref: "#/channels/rtf.maskinell.requests"
    reply:
      address:
        description: Resultatet skickas tillbaka till källan.
        location: "$message.header#/replyTo"
      channel:
        $ref: "#/channels/rtf.maskinell.responses"

components:
  schemas:
    RtfMaskinellRequestMessageHeaders:
      type: object
      properties:
        replyTo:
          type: string
          description: Topic där response ska skickas
        correlationId:
          type: string
          description: Unikt id som kopplar ihop request & response

    RtfMaskinellRequestMessageData:
      title: RtfMaskinellRequestMessageData
      type: object
      properties:
        kundbehovsflodeId:
          type: string
          description: Kundbehovsflöde id

    RtfMaskinellResponseMessageHeaders:
      type: object
      properties:
        correlationId:
          type: string
          description: Unikt id som kopplar ihop request & response

    RtfMaskinellResponseMessageData:
      title: RtfMaskinellResponseMessageData
      type: object
      properties:
        kundbehovsflodeId:
          type: string
          description: Kundbehovsflöde id
        rattTillForsakring:
          title: rattTillForsakring
          type: string
          description: Utfall av regel, om personen har rätt till försäkring
          enum:
            - Ja
            - Nej
            - Utredning
          example: Ja

  messages:
    RtfMaskinellRequestMessage:
      headers:
        $ref: "#/components/schemas/RtfMaskinellRequestMessageHeaders"
      payload:
        title: RtfMaskinellRequestMessagePayload
        allOf:
          - $ref: "kogito-cloudevent.yaml#/components/schemas/KogitoCloudEvent"
          - type: object
            title: RtfMaskinellRequestMessageData
            required:
              - data
            properties:
              data:
                $ref: "#/components/schemas/RtfMaskinellRequestMessageData"
    RtfMaskinellResponseMessage:
      headers:
        $ref: "#/components/schemas/RtfMaskinellResponseMessageHeaders"
      payload:
        title: RtfMaskinellResponseMessagePayload
        allOf:
          - $ref: "kogito-cloudevent.yaml#/components/schemas/KogitoCloudEvent"
          - type: object
            title: RtfMaskinellResponseMessageData
            required:
              - data
            properties:
              data:
                $ref: "#/components/schemas/RtfMaskinellResponseMessageData"
